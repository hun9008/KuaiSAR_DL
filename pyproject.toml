[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuaisar-xtr"
version = "0.1.0"
description = "Reproducible KuaiSAR XTR prediction experiments"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1", "numpy>=1.24", "pandas>=2.0", "pyarrow>=14",
  "scikit-learn>=1.3", "torch>=2.1", "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
